name: Collect social stats

on:
  schedule:
    - cron: "17 14 * * *"   # daily, ~6–7am Pacific
  workflow_dispatch:         # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull stats
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          LI_ORG_ID: ${{ secrets.LI_ORG_ID }}
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
        run: python collect.py
      - name: Save data
        if: always()
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Stats $(date -u +%F)"
          git push
